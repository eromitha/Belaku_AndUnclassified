<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchbook — Eromitha Ramesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Patrick+Hand+SC&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* VOICE: a pinned-up process sheet: white, airy, the drawings do all the talking.
   IDEA: sketches cut loose from their pages and composed freely on one white sheet, at different sizes.
   PICTURE: the collage itself; hovering quiets the rest, clicking brings up the painting.
   COLOUR and TYPE: pure white, graphite, one red; small Inter Tight and mono labels only.
   LAYOUT: tiny header, the composed sheet, a white reveal. */
:root{color-scheme:light only;--ink:#141414;--soft:#6a6a6a;--red:#d01406}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.01em}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px max(3vw,16px)}
header a{text-decoration:none;color:var(--soft)}header a:hover{color:var(--red)}
.sheet{position:relative;max-width:1400px;margin:0 auto;padding:clamp(24px,4vw,56px) max(3vw,16px) 0}
.board{position:relative}
.sk{all:unset;position:absolute;display:block;cursor:pointer}
.sk .pic{position:relative;display:block}
.sk img{display:block;width:100%;height:auto;mix-blend-mode:multiply;transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.2,1)}
.cm{position:absolute;width:12px;height:12px;border:0 solid var(--red);opacity:0;transition:opacity .25s,transform .3s;pointer-events:none}
.cm.tl{left:-9px;top:-9px;border-left-width:1.5px;border-top-width:1.5px;transform:translate(-4px,-4px)}
.cm.tr{right:-9px;top:-9px;border-right-width:1.5px;border-top-width:1.5px;transform:translate(4px,-4px)}
.cm.bl{left:-9px;bottom:-9px;border-left-width:1.5px;border-bottom-width:1.5px;transform:translate(-4px,4px)}
.cm.br{right:-9px;bottom:-9px;border-right-width:1.5px;border-bottom-width:1.5px;transform:translate(4px,4px)}
.sk.on .cm,.sk:focus-visible .cm{opacity:1;transform:none}
.sk:focus-visible{outline:none}
.cap{display:flex;justify-content:space-between;gap:14px;margin-top:15px;font-size:11px;color:#8a8a8a;white-space:nowrap}
.cap .to{color:var(--red);opacity:0;transition:opacity .25s}
.sk.on .cap .to,.sk:focus-visible .cap .to{opacity:1}
.sk.on .cap>span:first-child{color:var(--ink)}
.board.hovering .sk img{opacity:.4}
.board.hovering .sk.on img{opacity:1}
.sk.hide img{opacity:0;transform:translateY(18px)}
.foot{max-width:1440px;margin:0 auto;padding:48px max(3vw,16px) 40px;display:flex;justify-content:space-between;gap:16px;color:var(--soft);flex-wrap:wrap}

/* reveal */
dialog.rev{color:var(--ink);color-scheme:light;border:0;padding:0;margin:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;background:#fff;overflow:auto}
dialog.rev::backdrop{background:#fff}
.rv{min-height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;gap:22px;padding:16px max(3vw,16px) 28px}
.rv .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--ink);background:transparent;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{background:var(--ink);color:#fff}
.btn.red{border-color:var(--red);background:var(--red);color:#fff !important}.btn.red:hover{background:var(--ink);border-color:var(--ink)}
.rv .pair{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:clamp(20px,5vw,72px);align-items:center}
.rv figure{margin:0;display:grid;gap:10px}
.rv .s img{width:100%;height:auto;max-height:56vh;object-fit:contain;mix-blend-mode:multiply}
.rv .p{transition:opacity .7s .05s,transform .8s cubic-bezier(.2,.8,.2,1) .05s}
.rv .p img{width:100%;height:auto;max-height:68vh;object-fit:contain}
.rv figcaption{display:flex;justify-content:space-between;gap:12px;color:var(--soft)}
.rv.pre .p{opacity:0;transform:translateX(18px)}
.rv .info{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;align-items:end;border-top:1px solid var(--ink);padding-top:14px}
.rv .info h2{margin:0;font-weight:500;font-size:clamp(26px,3vw,44px);line-height:1.04;letter-spacing:-.02em}
.rv .info p{margin:6px 0 0;color:var(--soft)}
.rv .acts{display:flex;flex-wrap:wrap;gap:8px}

@media (max-width:720px){
  header span.mono{display:none}
  .board{display:grid;gap:36px;height:auto !important;padding-bottom:20px}
  .sk{position:static;width:auto !important}
  .sk.n{max-width:62%}
  .cap{white-space:normal}.cap .to{opacity:1}
  .board.hovering .sk img{opacity:1}
  .rv .pair,.rv .info{grid-template-columns:minmax(0,1fr)}
  .rv .s img{max-height:30vh}.rv .p img{max-height:46vh}
}
@media (prefers-reduced-motion:reduce){.sk img,.cm,.cap .to,.rv .p{transition:none}.sk.hide img{opacity:1;transform:none}}
/* asterisk cursor */
html,body{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2228%22%20height%3D%2228%22%20viewBox%3D%220%200%2028%2028%22%3E%3Cg%20stroke-linecap%3D%22round%22%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%228%22%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2214.0%22%20y2%3D%222.8%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2223.7%22%20y2%3D%228.4%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2223.7%22%20y2%3D%2219.6%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2214.0%22%20y2%3D%2225.2%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%224.3%22%20y2%3D%2219.6%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%224.3%22%20y2%3D%228.4%22/%3E%3C/g%3E%3Cg%20stroke%3D%22%23e00d00%22%20stroke-width%3D%225%22%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2214.0%22%20y2%3D%222.8%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2223.7%22%20y2%3D%228.4%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2223.7%22%20y2%3D%2219.6%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%2214.0%22%20y2%3D%2225.2%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%224.3%22%20y2%3D%2219.6%22/%3E%3Cline%20x1%3D%2214.0%22%20y1%3D%2214.0%22%20x2%3D%224.3%22%20y2%3D%228.4%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") 14 14,auto}
a,button,[data-open],.book,.vcell video,summary{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2236%22%20height%3D%2236%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cg%20stroke-linecap%3D%22round%22%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%229.5%22%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2218.0%22%20y2%3D%223.6%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2230.5%22%20y2%3D%2210.8%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2230.5%22%20y2%3D%2225.2%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2218.0%22%20y2%3D%2232.4%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%225.5%22%20y2%3D%2225.2%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%225.5%22%20y2%3D%2210.8%22/%3E%3C/g%3E%3Cg%20stroke%3D%22%23e00d00%22%20stroke-width%3D%226.5%22%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2218.0%22%20y2%3D%223.6%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2230.5%22%20y2%3D%2210.8%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2230.5%22%20y2%3D%2225.2%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%2218.0%22%20y2%3D%2232.4%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%225.5%22%20y2%3D%2225.2%22/%3E%3Cline%20x1%3D%2218.0%22%20y1%3D%2218.0%22%20x2%3D%225.5%22%20y2%3D%2210.8%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") 18 18,pointer !important}
</style>
</head>
<body>
<header>
  <a class="mono" href="index.html">← Eromitha Ramesh</a>
  <span class="mono" style="color:var(--soft)">Into the Rabbit Hole \ process</span>
</header>
<main class="sheet"><div class="board" id="board" aria-label="Sketchbook drawings"></div></main>
<p class="foot mono"><span>© 2026 Eromitha Ramesh</span><a href="index.html#works" style="text-decoration:none">All paintings →</a></p>

<dialog class="rev" id="rev" aria-labelledby="rvTitle">
  <div class="rv pre" id="rv">
    <div class="top"><span class="mono" id="rvTag" style="color:var(--soft)"></span><button class="btn" id="rvClose" type="button">Close</button></div>
    <div class="pair">
      <figure class="s"><img id="rvSk" alt=""><figcaption class="mono"><span>Sketch</span><span id="rvNo"></span></figcaption></figure>
      <figure class="p"><img id="rvPt" alt=""><figcaption class="mono"><span>Painting</span><span id="rvMeta"></span></figcaption></figure>
    </div>
    <div class="info">
      <div><h2 id="rvTitle"></h2><p id="rvText"></p></div>
      <div class="acts">
        <button class="btn" id="rvPrev" type="button">← Previous</button>
        <button class="btn" id="rvNext" type="button">Next →</button>
        <a class="btn red" id="rvOpen" href="index.html">Open the painting</a>
      </div>
    </div>
  </div>
</dialog>

<script>
{
  const paintings = {
    '02': {t:'Tensegrity of Thoughts', img:'img/tensegrity.jpg', meta:'Acrylic on canvas \\ 30 × 30 mm', line:'How mental frameworks flex, pull, and bear their own internal weight.'},
    '04': {t:'The “Spin”', img:'img/spin.jpg', meta:'Acrylic on canvas \\ 70 × 70 mm', line:'Discovering the grid was never rigid, but a curve all along.'},
    '05': {t:'Purge', img:'img/purge.jpg', meta:'Acrylic on canvas \\ 2400 × 80 mm', line:'The collapse, and the forces that restored order.'},
    '06': {t:'Neither Here, Nor There', img:'img/neither.jpg', meta:'Acrylic on canvas \\ 1500 × 60 mm', line:'Caught between original roots and total placelessness.'},
    '07': {t:'Liminal Existence', img:'img/liminal.jpg', meta:'Acrylic on canvas \\ 1200 × 450 mm', line:'Identity contracts under the weight of context.'},
    '08': {t:'The Grid that was Afraid to Meet the Curve', img:'img/grid.jpg', meta:'Acrylic on canvas \\ 1800 × 900 mm', line:'A pull toward something deeply familiar, yet long untouched.'},
    '09': {t:'Where do the Reins Lie', img:'img/reins.jpg', meta:'Acrylic on canvas \\ 1500 × 1500 mm', line:'A faux puppet within its own framework.'}
  };
  /* composed on a 1000-unit-wide sheet: x, y, width (height follows the drawing) */
  const D = (src, w, h, n, x, y, wd, alt, cap) => ({src:'img/' + src, w, h, n, x, y, wd, alt, cap});
  const items = [
    D('neither-process.jpg',2400,1250,'06',  40, 15, 530,'Notes titled In search of home, with ink sketches of rain trails and a street lamp','In search of home'),
    D('reins-process-1.jpg',2400,1115,'09', 610, 35, 350,'Ink sketches of spines and strings pulled from anchor points','Spines and strings'),
    D('tensegrity-process-1.jpg',2252,679,'02', 70, 340, 860,'Sketchbook pages titled Rabbit Hole: caves, nets and vaults with red grid studies','Rabbit hole, bounce back'),
    D('spin-process.jpg',1280,970,'04',  40, 660, 420,'Kochi 2026 sketchbook spread: a flexible grid that negotiates','Kochi, a flexible grid'),
    D('liminal-process.jpg',1200,1745,'07', 505, 680, 210,'Liminal existence: figures shrinking to get out of a frame','Liminal existence'),
    D('purge-process-3.jpg',230,959,'05', 790, 645, 150,'Tall coloured strip of figures twisting through a diamond lattice','Lattice strip'),
    D('grid-process-4.jpg',2000,821,'08',  40, 1025, 470,'Ink and magenta studies titled The grid that was afraid to meet the curve','Grid meets curve'),
    D('purge-process-1.jpg',692,960,'05', 580, 1040, 170,'Ink study in red, blue and black of a cluttered grid','Clutter and escapism'),
    D('grid-process-1.jpg',2400,802,'08',  40, 1280, 520,'Grid studies pulled into curves in numbered stages','Grid in stages'),
    D('purge-process-2.jpg',704,486,'05', 630, 1340, 220,'Ink sketch about escapism','Escapism'),
    D('grid-process-5.jpg',2000,1501,'08', 40, 1515, 330,'Green sketchbook spread of three-dimensional grids tangled with red curves','Grids in three dimensions'),
    D('grid-process-3.jpg',2400,1373,'08', 410, 1555, 380,'Sketchbook pages in ink and red crayon on how grid and curve interact','Grid and curve, pages'),
    D('purge-process-floor.jpg',620,1400,'05', 840, 1545, 115,'Photo from above of the long canvas being painted on the floor','On the floor'),
    D('tensegrity-process-2.jpg',2400,474,'02', 90, 1845, 800,'Long wall of pencil grid drawings with pink notes','The wall of grids'),
    D('grid-process-6.jpg',2000,1431,'08', 320, 2055, 360,'Pages on anchors, tension and the infinitely zoomable grid','Anchors and tension')
  ];
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const board = document.getElementById('board');
  board.innerHTML = items.map((d, i) => `<button class="sk${d.w / d.h < .7 ? ' n' : ''}" type="button" data-i="${i}" aria-label="${esc(d.alt)}. Show the painting ${esc(paintings[d.n].t)}."><span class="pic"><img src="${d.src}" width="${d.w}" height="${d.h}" alt="" loading="${i < 6 ? 'eager' : 'lazy'}"><i class="cm tl"></i><i class="cm tr"></i><i class="cm bl"></i><i class="cm br"></i></span></button>`).join('');
  const els = [...board.children];

  const place = () => {
    if (innerWidth <= 720) { els.forEach(e => { e.style.left = e.style.top = e.style.width = ''; }); board.style.height = ''; return; }
    const k = board.clientWidth / 1000; let bottom = 0;
    items.forEach((d, i) => {
      const e = els[i], w = d.wd * k, h = w * d.h / d.w;
      e.style.left = d.x * k + 'px'; e.style.top = d.y * k + 'px'; e.style.width = w + 'px';
      bottom = Math.max(bottom, d.y * k + h);
    });
    board.style.height = bottom + 40 + 'px';
  };
  place();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
    els.forEach(e => e.classList.add('hide'));
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { const e = en.target; setTimeout(() => e.classList.remove('hide'), (+e.dataset.i % 3) * 90); io.unobserve(e); } }), {rootMargin:'0px 0px -6% 0px'});
    els.forEach(e => io.observe(e));
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(place, 100); });

  /* hover: quiet everything else */
  const on = i => { board.classList.add('hovering'); els.forEach((e, k) => e.classList.toggle('on', k === i)); };
  const off = () => { board.classList.remove('hovering'); els.forEach(e => e.classList.remove('on')); };
  els.forEach((e, i) => { e.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') on(i); }); e.addEventListener('focus', () => on(i)); });
  board.addEventListener('pointerleave', off); board.addEventListener('focusout', e => { if (!board.contains(e.relatedTarget)) off(); });

  /* reveal */
  const dlg = document.getElementById('rev'), rv = document.getElementById('rv'), $ = id => document.getElementById(id);
  let cur = 0;
  const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fill = i => {
    cur = (i + items.length) % items.length; const d = items[cur], p = paintings[d.n];
    $('rvTag').textContent = String(cur + 1).padStart(2, '0') + ' / ' + items.length;
    $('rvSk').src = d.src; $('rvSk').alt = d.alt; $('rvNo').textContent = 'RH:' + d.n;
    $('rvPt').src = p.img; $('rvPt').alt = 'The painting ' + p.t; $('rvMeta').textContent = p.meta;
    $('rvTitle').textContent = p.t; $('rvText').textContent = p.line;
    $('rvOpen').href = 'index.html#rh-' + d.n;
    rv.classList.add('pre'); if (calm()) rv.classList.remove('pre'); else requestAnimationFrame(() => requestAnimationFrame(() => rv.classList.remove('pre')));
  };
  board.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; fill(+b.dataset.i); try { dlg.showModal(); } catch (_) { dlg.setAttribute('open', ''); } dlg.scrollTop = 0; });
  $('rvClose').addEventListener('click', () => dlg.close());
  $('rvPrev').addEventListener('click', () => fill(cur - 1));
  $('rvNext').addEventListener('click', () => fill(cur + 1));
  dlg.addEventListener('keydown', e => { if (e.key === 'ArrowRight') fill(cur + 1); if (e.key === 'ArrowLeft') fill(cur - 1); });
  dlg.addEventListener('close', () => { off(); els[cur] && els[cur].focus({preventScroll:true}); });
}
</script>
</body>
</html>
